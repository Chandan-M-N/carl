apiVersion: apps/v1
kind: Deployment
metadata:
  name: carl
  labels:
    app.kubernetes.io/name: carl
spec:
  replicas: 1
  selector:
    matchLabels:
      name: carl-gpu-deploy
  template:
    metadata:
      labels:
        name: carl-gpu-deploy
        app.kubernetes.io/name: carl
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: carl
        image: ghcr.io/chandan-m-n/carl:latest
        command: ["/opt/carl/gpuTest.sh"]
        args: ["16384"]
        env:
        - name: SLEEP_SECONDS
          value: "60"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "gpu-worker"
        effect: "NoExecute"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
