# One-shot GPU test: runs the Monte-Carlo Pi calculation ITERATIONS times on each
# of `completions` pods, then exits. Check results with:
#   kubectl wait --for=condition=complete job/carl-test --timeout=10m
#   kubectl logs -l job-name=carl-test
apiVersion: batch/v1
kind: Job
metadata:
  name: carl-test
  labels:
    app.kubernetes.io/name: carl
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carl
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: carl
        image: ghcr.io/chandan-m-n/carl:latest
        command: ["/opt/carl/gpuTest.sh"]
        args: ["16384"]
        env:
        - name: ITERATIONS
          value: "3"
        - name: SLEEP_SECONDS
          value: "5"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "gpu-worker"
        effect: "NoExecute"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
